version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    ignore:
      # TODO: remove below entries once the application supports React >= 19.0.0
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-icons"
      # deck.gl and luma.gl share strict peer constraints across the root and
      # plugin workspaces, and root overrides pin their transitive versions.
      # Upgrade both families together in a manually validated change.
      - dependency-name: "@deck.gl/*"
      - dependency-name: "@luma.gl/*"
      # `just-handlerbars-helpers` library in plugin-chart-handlebars requires `currencyformatter`` to be < 2
      - dependency-name: "currencyformatter.js"
        update-types: ["version-update:semver-major"]
      # TODO: remove below clause once https://github.com/pmmmwh/react-refresh-webpack-plugin/pull/940 lands onto a future release
      # and confirm the issue https://github.com/apache/superset/issues/39600 is fixed
      - dependency-name: "react-checkbox-tree"
        update-types: ["version-update:semver-major"]
      # Babel 8 (7.x -> 8.x) is blocked on the surrounding ecosystem: @emotion/babel-plugin
      # (NodePath#hoist) and babel-plugin-jsx-remove-data-test-id (t.jSXOpeningElement).
      # Ignore the coordinated major bump until the ecosystem catches up; it must be done
      # as a single manual upgrade anyway. TODO: remove when Babel 8 support is viable.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # v2.0.0 renamed ZSTDDecompress to decompress and made it async, breaking
      # the webpack dev proxy (see #38662, #39138, #39139). Dependabot reopened
      # the same bump in #39369 after the first revert, so pin it here instead
      # of relying on a package.json comment (package.json is JSON and can't
      # hold comments). Remove this once the proxy code is updated to await
      # the async decompress() API.
      - dependency-name: "simple-zstd"
      # Security triage determination (2026-09-20, finding
      # `unresolvable-advisory:xlsx`, rbutexas/superset#1):
      # `xlsx` is installed from https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz,
      # not from the npm registry. GHSA-4r6h-8v6p-xvw6 (CVE-2023-30533, fixed in
      # 0.19.3) and GHSA-5pgg-2g8v-p4x9 (CVE-2024-22363, fixed in 0.20.2) carry
      # an open-ended OSV range (`introduced: 0`, no `fixed` event) because the
      # fix releases were never published to the registry, so scanners flag
      # 0.20.3 even though it is above both fix versions. Both CVEs concern
      # parsing untrusted workbooks; Superset only writes workbooks
      # (superset-frontend/src/utils/downloadAsPivotExcel.ts). Registry latest
      # is 0.18.5, BELOW both fixes, so a "security update" to a registry
      # release would be a downgrade into affected code. Never accept one.
      # This entry ignores every version <= 0.20.3 and therefore stops applying
      # as soon as any newer release exists — re-evaluate then, or by 2027-09-20
      # if SheetJS has still not published >= 0.20.3 to the registry.
      - dependency-name: "xlsx"
        versions: ["<= 0.20.3"]
    directory: "/superset-frontend/"
    schedule:
      interval: "daily"
    labels:
      - npm
      - dependabot
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
      rjsf:
        patterns:
          - "@rjsf/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      babel:
        patterns:
          - "@babel/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
          - "eslint-plugin-storybook"
      ag-grid:
        patterns:
          - "ag-grid-react"
          - "ag-grid-community"
      swc:
        patterns:
          - "@swc/core"
          - "@swc/plugin-emotion"
          - "@swc/plugin-transform-imports"
      jsonforms:
        patterns:
          - "@jsonforms/*"
      visx:
        patterns:
          - "@visx/*"
      emotion:
        patterns:
          - "@emotion/*"
      fontsource:
        patterns:
          - "@fontsource/*"
    open-pull-requests-limit: 30
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 10
    # Bump the lower bound to the new version, not just widen the upper
    # bound. Without this, a `sqlglot>=28.10.0, <29` constraint upgraded
    # to `<30` would keep the stale lower bound forever, dragging
    # transitively-resolved versions with it. See #40186 (review thread).
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    labels:
      - pip
      - dependabot
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: ".github/actions"
    schedule:
      interval: "daily"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    open-pull-requests-limit: 10
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/docs/"
    schedule:
      interval: "daily"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      docusaurus:
        patterns:
          - "@docusaurus/*"
      docusaurus-openapi:
        patterns:
          - "docusaurus-plugin-openapi-docs"
          - "docusaurus-theme-openapi-docs"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/superset-websocket/"
    schedule:
      interval: "daily"
    labels:
      - npm
      - dependabot
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/superset-websocket/utils/client-ws-app/"
    schedule:
      interval: "daily"
    labels:
      - npm
      - dependabot
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    open-pull-requests-limit: 10
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/superset-embedded-sdk/"
    schedule:
      interval: "daily"
    labels:
      - npm
      - dependabot
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
      babel:
        patterns:
          - "@babel/*"
    versioning-strategy: increase
    cooldown:
      default-days: 7
